spring:
  datasource:
    url: jdbc:mysql://localhost:3306/employee_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Môi trường Dev: Log chi tiết ở mức DEBUG để lập trình viên theo dõi
logging:
  level:
    root: INFO
    com.suntraining.employeemanagement: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [DEV] [%thread] %-5level %logger{36} - %msg%n"
