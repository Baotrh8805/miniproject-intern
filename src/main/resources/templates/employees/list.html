<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Nhân Viên - Employee Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
    <!-- Tiêu đề trang -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-primary mb-1">Quản Lý Nhân Viên</h2>
            <p class="text-muted mb-0">Module 6: Spring Boot Web (MVC + Thymeleaf)</p>
        </div>
        <a th:href="@{/employees/add}" class="btn btn-success px-3 py-2 shadow-sm">
            + Thêm nhân viên mới
        </a>
    </div>

    <!-- Khung tìm kiếm nhân viên theo tên hoặc phòng ban -->
    <div class="card shadow-sm mb-4">
        <div class="card-body p-4">
            <h5 class="card-title fw-semibold mb-3">Tìm kiếm nhân viên</h5>
            <form th:action="@{/employees/list}" method="get" class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label for="name" class="form-label fw-medium">Tên nhân viên</label>
                    <input type="text"
                           id="name"
                           name="name"
                           th:value="${searchName}"
                           class="form-control"
                           placeholder="Nhập tên nhân viên cần tìm...">
                </div>

                <div class="col-md-4">
                    <label for="departmentId" class="form-label fw-medium">Phòng ban</label>
                    <select id="departmentId" name="departmentId" class="form-select">
                        <option value="">-- Tất cả phòng ban --</option>
                        <option th:each="dept : ${departments}"
                                th:value="${dept.id}"
                                th:text="${dept.code + ' - ' + dept.name}"
                                th:selected="${searchDepartmentId == dept.id}">
                        </option>
                    </select>
                </div>

                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1">Tìm kiếm</button>
                    <a th:href="@{/employees/list}" class="btn btn-outline-secondary">Xóa lọc</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bảng danh sách nhân viên -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-primary">
                    <tr>
                        <th class="text-center" style="width: 50px;">#</th>
                        <th>Mã NV</th>
                        <th>Họ và tên</th>
                        <th>Email</th>
                        <th>Mức lương</th>
                        <th>Phòng ban</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Hiển thị khi danh sách có dữ liệu -->
                    <tr th:each="emp, stat : ${employees}">
                        <td class="text-center" th:text="${stat.count}">1</td>
                        <td>
                            <span class="badge bg-light text-dark border" th:text="${emp.employeeCode}">EMP-1001</span>
                        </td>
                        <td class="fw-semibold text-dark" th:text="${emp.name}">Nguyen Van A</td>
                        <td th:text="${emp.email}">vana@sun.com</td>
                        <td class="text-success fw-medium">
                            <span th:text="${emp.salary}">0.0</span> $
                        </td>
                        <td>
                            <span class="badge bg-primary"
                                  th:if="${emp.department != null}"
                                  th:text="${emp.department.code + ' - ' + emp.department.name}">IT</span>
                            <span class="badge bg-secondary"
                                  th:if="${emp.department == null}">Chưa phân bổ</span>
                        </td>
                    </tr>

                    <!-- Hiển thị khi không có dữ liệu -->
                    <tr th:if="${employees == null or #lists.isEmpty(employees)}">
                        <td colspan="6" class="text-center py-4 text-muted">
                            Không tìm thấy nhân viên nào phù hợp với điều kiện tìm kiếm.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white border-0 py-3 text-muted small">
            Tổng số nhân viên: <strong th:text="${employees != null ? #lists.size(employees) : 0}">0</strong>
        </div>
    </div>
</div>
</body>
</html>
