<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Nhân Viên Mới - Employee Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border: none;
            border-radius: 12px;
        }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
            <!-- Tiêu đề -->
            <div class="mb-4 text-center">
                <h2 class="fw-bold text-primary mb-1">Thêm Nhân Viên Mới</h2>
                <p class="text-muted">Nhập đầy đủ thông tin bên dưới để thêm nhân viên vào hệ thống</p>
            </div>

            <!-- Card Form -->
            <div class="card shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <form th:action="@{/employees/add}" th:object="${employee}" method="post">

                        <!-- Họ và tên -->
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                            <input type="text"
                                   id="name"
                                   th:field="*{name}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                   placeholder="Ví dụ: Nguyen Van A">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                Tên không hợp lệ
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                            <input type="email"
                                   id="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   placeholder="Ví dụ: vana@sun.com">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                Email không hợp lệ
                            </div>
                        </div>

                        <!-- Mức lương -->
                        <div class="mb-3">
                            <label for="salary" class="form-label fw-semibold">Mức lương ($) <span class="text-danger">*</span></label>
                            <input type="number"
                                   step="0.01"
                                   id="salary"
                                   th:field="*{salary}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('salary')} ? 'is-invalid' : ''"
                                   placeholder="Ví dụ: 1500.00">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}">
                                Mức lương không hợp lệ
                            </div>
                        </div>

                        <!-- Phòng ban -->
                        <div class="mb-4">
                            <label for="departmentId" class="form-label fw-semibold">Phòng ban <span class="text-danger">*</span></label>
                            <select id="departmentId"
                                    th:field="*{departmentId}"
                                    class="form-select"
                                    th:classappend="${#fields.hasErrors('departmentId')} ? 'is-invalid' : ''">
                                <option value="">-- Chọn phòng ban --</option>
                                <option th:each="dept : ${departments}"
                                        th:value="${dept.id}"
                                        th:text="${dept.code + ' - ' + dept.name}">
                                </option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}">
                                Vui lòng chọn phòng ban
                            </div>
                        </div>

                        <!-- Các nút bấm -->
                        <div class="d-flex justify-content-between align-items-center pt-2">
                            <a th:href="@{/employees/list}" class="btn btn-outline-secondary px-4">
                                ← Quay lại danh sách
                            </a>
                            <button type="submit" class="btn btn-primary px-4">
                                Lưu nhân viên
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
